<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Will You Marry Me?</title>

<style>

body{
margin:0;
padding:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
background:#ffeff5;
font-family:Arial,sans-serif;
overflow:hidden;
text-align:center;
}

h1{
font-size:4rem;
color:#ff4d88;
}

p{
font-size:1.5rem;
}

button{
padding:15px 30px;
font-size:1.1rem;
border:none;
border-radius:30px;
cursor:pointer;
margin:10px;
}

#yes{
background:#ff4d88;
color:white;
}

#no{
position:absolute;
background:white;
}

.heart{
position:fixed;
font-size:25px;
animation:float 5s linear forwards;
}

@keyframes float{
0%{
transform:translateY(100vh);
opacity:1;
}
100%{
transform:translateY(-100px);
opacity:0;
}
}

</style>
</head>

<body>

<audio id="music" loop>
<source src="darkhaast.mp3" type="audio/mpeg">
</audio>

<h1>Will You Marry Me? 💍</h1>

<p>
You are my favorite person,
my safest place,
and my greatest adventure.
</p>

<button id="yes">
YES, A THOUSAND TIMES YES ❤️
</button>

<button id="no">
NO 😏
</button>

<script>

document.body.addEventListener("click",function(){
document.getElementById("music").play();
},{once:true});

const no=document.getElementById("no");

document.addEventListener("mousemove",(e)=>{

const rect=no.getBoundingClientRect();

const dx=e.clientX-(rect.left+rect.width/2);
const dy=e.clientY-(rect.top+rect.height/2);

const distance=Math.sqrt(dx*dx+dy*dy);

if(distance<120){

no.style.left=Math.random()*(window.innerWidth-150)+"px";
no.style.top=Math.random()*(window.innerHeight-100)+"px";

}

});

document.getElementById("yes").onclick=function(){

document.body.innerHTML=`

<h1>💍 SHE SAID YES 💍</h1>

<p>
Today begins our forever ❤️
</p>

`;

setInterval(()=>{

const heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"vw";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},5000);

},150);

};

</script>

</body>
</html>
